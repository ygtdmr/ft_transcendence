# Local development only: PostgreSQL plus the stats-service.
# Run from backend/stats-service:  docker compose up --build
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: stats
      POSTGRES_PASSWORD: change-me-local-only
      POSTGRES_DB: stats
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - stats-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stats -d stats"]
      interval: 3s
      timeout: 3s
      retries: 20

  stats-service:
    build:
      context: ..
      dockerfile: stats-service/Dockerfile
    environment:
      PORT: "8080"
      APP_ENV: development
      DATABASE_URL: postgres://stats:change-me-local-only@postgres:5432/stats?sslmode=disable
      MIGRATE_ON_START: "true"
    ports:
      - "127.0.0.1:8082:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  stats-postgres-data:
