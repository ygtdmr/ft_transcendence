name: local
variables:
  - name: apiVersion
    value: "v1"
    type: string
    description: "Stable legacy REST and WebSocket contract prefix"
  - name: gameApiVersion
    value: "v2"
    type: string
    description: "Version prefix for the new room and game lifecycle contracts"
  - name: chatApiVersion
    value: "v2"
    type: string
    description: "Version prefix for the new Channel Service and Chat Gateway contracts"
  - name: baseUrl
    value: "http://localhost:3000"
    type: string
    description: "Local REST API origin"
  - name: wsUrl
    value: "ws://localhost:3000"
    type: string
    description: "Local Game Gateway WebSocket origin"
  - name: chatWsUrl
    value: "ws://localhost:3000"
    type: string
    description: "Same-origin Chat Gateway route through the local reverse proxy"
  - name: userId
    value: "42"
    type: number
    description: "Current fixture user ID; registration overwrites it at runtime"
  - name: roomId
    value: "1001"
    type: number
    description: "Current room ID; room creation overwrites it at runtime"
  - name: gameId
    value: "5001"
    type: number
    description: "Canonical match ID used by state examples"
  - name: channelId
    value: "7001"
    type: number
    description: "Current direct-chat channel ID"
  - name: userInternalUrl
    value: ""
    type: string
    description: "User Service private listener origin (INTERNAL_PORT); never routed through the public reverse proxy"
  - name: authToUserServiceCredential
    value: ""
    type: string
    description: "Local Auth-to-User service credential; set only in uncommitted local configuration"
  - name: authInternalUrl
    value: ""
    type: string
    description: "Auth Service private listener origin (INTERNAL_PORT); never routed through the public reverse proxy"
  - name: userToAuthServiceCredential
    value: ""
    type: string
    description: "Local User-to-Auth service credential; set only in uncommitted local configuration"
  - name: gameGatewayToAuthServiceCredential
    value: ""
    type: string
    description: "Local Game Gateway-to-Auth service credential; set only in uncommitted local configuration"
  - name: channelToUserServiceCredential
    value: ""
    type: string
    description: "Local Channel Service-to-User service credential; set only in uncommitted local configuration"
  - name: gameInternalUrl
    value: ""
    type: string
    description: "Game Session private listener origin (INTERNAL_PORT); never routed through the public reverse proxy"
  - name: authToGameServiceCredential
    value: ""
    type: string
    description: "Local Auth-to-Game Session service credential; set only in uncommitted local configuration"
  - name: userToGameServiceCredential
    value: ""
    type: string
    description: "Local User-to-Game Session service credential; set only in uncommitted local configuration"
