name: local
variables:
  - name: apiVersion
    value: "v1"
    type: string
    description: "Stable legacy REST and WebSocket contract prefix"
  - name: gameApiVersion
    value: "v2"
    type: string
    description: "Version prefix for the new room and game lifecycle contracts"
  - name: notificationApiVersion
    value: "v2"
    type: string
    description: "Version prefix for the Notification Gateway socket contract"
  - name: baseUrl
    value: "http://localhost:3000"
    type: string
    description: "Local REST API origin"
  - name: wsUrl
    value: "ws://localhost:3000"
    type: string
    description: "Local same-origin WebSocket origin for the Game Gateway and Notification Gateway routes"
  - name: userId
    value: "42"
    type: number
    description: "Current fixture user ID; registration overwrites it at runtime"
  - name: roomId
    value: "1001"
    type: number
    description: "Current room ID; room creation overwrites it at runtime"
  - name: gameId
    value: "5001"
    type: number
    description: "Canonical match ID used by state examples"
  - name: userInternalUrl
    value: ""
    type: string
    description: "User Service private listener origin (INTERNAL_PORT); never routed through the public reverse proxy"
  - name: authToUserServiceCredential
    value: ""
    type: string
    description: "Local Auth-to-User service credential; set only in uncommitted local configuration"
  - name: authInternalUrl
    value: ""
    type: string
    description: "Auth Service private listener origin (INTERNAL_PORT); never routed through the public reverse proxy"
  - name: userToAuthServiceCredential
    value: ""
    type: string
    description: "Local User-to-Auth service credential; set only in uncommitted local configuration"
  - name: gameGatewayToAuthServiceCredential
    value: ""
    type: string
    description: "Local Game Gateway-to-Auth service credential; set only in uncommitted local configuration"
  - name: gameSessionToUserServiceCredential
    value: ""
    type: string
    description: "Local Game Session-to-User service credential; set only in uncommitted local configuration"
  - name: gameInternalUrl
    value: ""
    type: string
    description: "Game Session private listener origin (INTERNAL_PORT); never routed through the public reverse proxy"
  - name: authToGameServiceCredential
    value: ""
    type: string
    description: "Local Auth-to-Game Session service credential; set only in uncommitted local configuration"
  - name: userToGameServiceCredential
    value: ""
    type: string
    description: "Local User-to-Game Session service credential; set only in uncommitted local configuration"
  - name: gatewayToGameServiceCredential
    value: ""
    type: string
    description: "Local Game Gateway-to-Game Session service credential; set only in uncommitted local configuration"
  - name: gameGatewayInternalUrl
    value: ""
    type: string
    description: "Game Gateway private listener origin (INTERNAL_PORT); never routed through the public reverse proxy"
  - name: notificationGatewayInternalUrl
    value: ""
    type: string
    description: "Notification Gateway private listener origin (INTERNAL_HOST:INTERNAL_PORT); never routed through the public reverse proxy"
  - name: userToGameGatewayServiceCredential
    value: ""
    type: string
    description: "Local User-to-Game Gateway service credential; set only in uncommitted local configuration"
  - name: userToNotificationGatewayServiceCredential
    value: ""
    type: string
    description: "Local User-to-Notification Gateway service credential; set only in uncommitted local configuration"
  - name: authToNotificationGatewayServiceCredential
    value: ""
    type: string
    description: "Local Auth-to-Notification Gateway service credential; set only in uncommitted local configuration"
