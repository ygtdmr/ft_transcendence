# Ingress: the only container that publishes a port. It terminates TLS and
# forwards an explicit allowlist: every /api/ request to the Web BFF (which owns the
# route table, the origin check and the session check), the two v2 sockets to their
# gateways, and the avatar files to User Service. Everything else, including every
# /internal path, is a 404.
# Run by nginxinc/nginx-unprivileged: no root, no capabilities, read-only root.
#
# The JSON access log carries the request id the services adopt, so one id spans the
# ingress log and the service logs. There is no SPA yet: the frontend is not on an
# integration branch, and when it lands its static root and `try_files` fallback
# are added here.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    server_tokens off;

    log_format json_combined escape=json
      '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
      '"request":"$request","status":$status,"body_bytes":$body_bytes_sent,'
      '"request_time":$request_time,"request_id":"$request_id"}';
    access_log /dev/stdout json_combined;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Docker's embedded DNS. Upstreams are resolved per request, so the ingress
    # starts and recovers even while a service is down or restarting.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # --- Cross-site protection for cookie-authenticated writes --------------------
    # The rule of workspace.yml, Same-Origin Model: a POST, PUT, PATCH or DELETE must
    # carry exactly one Origin equal to this site's own origin. With no Origin, a
    # Sec-Fetch-Site other than same-origin or none is refused; a request with
    # neither header is not from a browser and passes. The ingress applies it before
    # any service sees the request, so it holds even for a service that has not yet
    # adopted the shared origin guard. GET, HEAD and OPTIONS are not checked, and
    # no CORS header is ever added.
    map $request_method $unsafe_method {
        default 0;
        POST    1;
        PUT     1;
        PATCH   1;
        DELETE  1;
    }
    # Origin against this request's own origin (scheme and host:port as the client
    # addressed it). Duplicate Origin headers arrive comma-joined and never match.
    map "$http_origin|https://$http_host" $origin_state {
        default       foreign;
        "~^\|"        none;
        "~^(.+)\|\1$" same;
    }
    map $http_sec_fetch_site $fetch_state {
        default     cross;
        ""          absent;
        same-origin same;
        none        same;
    }
    map "$unsafe_method:$origin_state:$fetch_state" $cross_site_write {
        default            0;
        "~^1:foreign:"     1;
        "~^1:none:cross"   1;
    }

    # Coarse flood limit per client address; each service enforces its own,
    # contract-defined limits behind it.
    limit_req_zone $binary_remote_addr zone=public:10m rate=50r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=sockets:10m;
    limit_conn_status 429;

    # The 500 body of an unreachable service must not name the upstream.
    proxy_intercept_errors off;
    proxy_http_version 1.1;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    # The ingress is the only authority for the client address and request id: it
    # overwrites whatever the client sent instead of appending to it.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id      $request_id;
    # Identity headers belong to the private gateway-to-service calls only.
    proxy_set_header X-User-Id         "";
    proxy_set_header X-Session-Id      "";
    # Origin and Cookie reach the services unchanged: they decide the cross-site
    # checks and the session.

    client_max_body_size 128k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    large_client_header_buffers 4 8k;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1h;
    ssl_session_cache shared:ssl:5m;
    ssl_session_tickets off;

    server {
        listen 8443 ssl;
        http2 on;
        server_name localhost;

        ssl_certificate     /run/secrets/tls_certificate;
        ssl_certificate_key /run/secrets/tls_key;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        # Responses are API data and sockets, never pages; a stray page cannot run script.
        add_header Content-Security-Policy   "default-src 'none'; frame-ancestors 'none'" always;

        limit_req zone=public burst=100 nodelay;

        # Refused before the session is looked at, with the contract's error shape.
        if ($cross_site_write) {
            return 403 '{"error":{"code":"FORBIDDEN_ORIGIN","message":"The request does not come from this site.","details":{}}}';
        }
        default_type application/json;

        # Liveness of the ingress itself. Services answer on their own listeners.
        location = /ingress/healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Never routed. Private listeners are also on a network this container
        # does not share; this rule keeps a misrouted path from ever reaching one.
        location ^~ /internal {
            return 404;
        }

        # --- Web BFF: every browser REST route (/api/v1 and /api/v2) ------------------
        # The BFF answers NOT_FOUND in the contract's shape for any /api path it does
        # not own, so the ingress forwards the whole prefix instead of keeping a second
        # route table. It is also what lets Game Session's REST routes be reached: they
        # take the caller from X-User-Id, which only the BFF sets from a validated
        # session (the ingress clears any value the client sent).
        # Avatar upload carries a 2 MiB image (the service allows 2 MiB + 64 KiB).
        location = /api/v1/users/me/avatar {
            client_max_body_size 2200k;
            set $upstream http://web-bff:8080;
            proxy_pass $upstream;
        }

        location ^~ /api/ {
            set $upstream http://web-bff:8080;
            proxy_pass $upstream;
        }

        # --- Avatar files (static, no session): served by User Service -----------------
        location ^~ /static/avatars/ {
            set $upstream http://user-service:8080;
            proxy_pass $upstream;
        }

        # --- Game Gateway (room socket) ---------------------------------------------
        location ~ ^/ws/v2/rooms/[0-9]+$ {
            limit_conn sockets 20;
            set $upstream http://game-gateway:8080;
            proxy_pass $upstream;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id      $request_id;
            proxy_set_header X-User-Id         "";
            proxy_set_header X-Session-Id      "";
            # The gateway pings every 25 s; an idle socket is not a stuck request.
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # --- Notification Gateway (notification socket) ------------------------------
        location = /ws/v2/notifications {
            limit_conn sockets 20;
            set $upstream http://notification-gateway:8080;
            proxy_pass $upstream;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id      $request_id;
            proxy_set_header X-User-Id         "";
            proxy_set_header X-Session-Id      "";
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        location / {
            return 404;
        }
    }
}
