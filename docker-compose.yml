# The backend stack: `make up` generates the secrets and the local certificate
# and starts everything below. Owner-by-owner notes are in docs/DEPLOY.md.
#
# Networks
#   edge     the ingress and each service's public listener (8080).
#   private  internal: true, so it has no route out. PostgreSQL, RabbitMQ and every
#            service's private listener (8081, /internal/v1) live here.
# Only the ingress publishes a port, and only on 127.0.0.1.

name: ft-transcendence

x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 512
  tmpfs: ["/tmp:size=16m"]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

x-public-base-url: &public_base_url ${PUBLIC_BASE_URL:-https://localhost:8443}

services:
  # --- Data stores -------------------------------------------------------------
  postgres:
    <<: *hardened
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_superuser
    secrets:
      - postgres_superuser
      - db_auth_service
      - db_user_service
      - db_stats_service
      - db_game_session
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-databases.sh:ro
    # The image starts as root to prepare its data directory, then drops to
    # postgres; those are the only capabilities that needs.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    tmpfs: ["/tmp:size=16m", "/run/postgresql:size=1m,uid=70,gid=70"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [private]

  rabbitmq:
    <<: *hardened
    image: rabbitmq:4.4.0-alpine
    # The image's data directory belongs to this user; as root it would fail to
    # read its own Erlang cookie.
    user: rabbitmq
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      # default_user and default_pass, generated by scripts/make-secrets.sh. The
      # image's own *_FILE variables are deprecated in RabbitMQ 4.
      - ./secrets/rabbitmq.conf:/etc/rabbitmq/conf.d/20-credentials.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 30
    networks: [private]

  # --- Migrations: each service applies its own, once, before it starts ------------
  # golang-migrate holds a PostgreSQL advisory lock, so concurrent runs are safe, and
  # it records the version it reached, so a repeat applies nothing. User and Stats
  # embed theirs and apply them at start (MIGRATE_ON_START).
  auth-migrate:
    <<: *hardened
    image: migrate/migrate:v4.19.1
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        exec migrate -path /migrations
        -database "postgres://auth:$$(cat /run/secrets/db_auth_service)@postgres:5432/auth?sslmode=disable"
        up
    volumes:
      - ./backend/auth-service/migrations:/migrations:ro
    secrets: [db_auth_service]
    depends_on:
      postgres: {condition: service_healthy}
    networks: [private]

  game-migrate:
    <<: *hardened
    image: migrate/migrate:v4.19.1
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        exec migrate -path /migrations
        -database "postgres://gamesession:$$(cat /run/secrets/db_game_session)@postgres:5432/gamesession?sslmode=disable"
        up
    volumes:
      - ./backend/game-session/migrations:/migrations:ro
    secrets: [db_game_session]
    depends_on:
      postgres: {condition: service_healthy}
    networks: [private]

  # --- Services --------------------------------------------------------------------
  auth-service:
    <<: *hardened
    build: {context: ./backend, dockerfile: auth-service/Dockerfile}
    image: ft-transcendence/auth-service:local
    env_file: [secrets/env/auth-service.env]
    environment:
      APP_ENV: production
      PORT: "8080"
      INTERNAL_PORT: "8081"
      # Google sign-in is off unless all three are set (Auth refuses a partial set).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      PUBLIC_BASE_URL: ${GOOGLE_CLIENT_ID:+${PUBLIC_BASE_URL:-https://localhost:8443}}
      # The ingress is the only proxy; it overwrites X-Forwarded-For.
      TRUSTED_PROXIES: 172.29.10.0/24
      # Callers of Auth's private listener.
      GAME_GATEWAY_CREDENTIAL_FILE: /run/secrets/game-gateway-to-auth-service
      NOTIFICATION_GATEWAY_CREDENTIAL_FILE: /run/secrets/notification-gateway-to-auth-service
      STATS_SERVICE_CREDENTIAL_FILE: /run/secrets/stats-service-to-auth-service
      USER_SERVICE_CREDENTIAL_FILE: /run/secrets/user-service-to-auth-service
      # Auth's own calls.
      USER_INTERNAL_URL: http://user-service.private:8081
      USER_SERVICE_OUTBOUND_CREDENTIAL_FILE: /run/secrets/auth-service-to-user-service
      GAME_INTERNAL_URL: http://game-session.private:8081
      GAME_SERVICE_OUTBOUND_CREDENTIAL_FILE: /run/secrets/auth-service-to-game-session
      GAME_GATEWAY_INTERNAL_URLS: http://game-gateway.private:8081
      GAME_GATEWAY_OUTBOUND_CREDENTIAL_FILE: /run/secrets/auth-service-to-game-gateway
      NOTIFICATION_GATEWAY_INTERNAL_URLS: http://notification-gateway.private:8081
      NOTIFICATION_GATEWAY_OUTBOUND_CREDENTIAL_FILE: /run/secrets/auth-service-to-notification-gateway
    secrets:
      - game-gateway-to-auth-service
      - notification-gateway-to-auth-service
      - stats-service-to-auth-service
      - user-service-to-auth-service
      - auth-service-to-user-service
      - auth-service-to-game-session
      - auth-service-to-game-gateway
      - auth-service-to-notification-gateway
    depends_on:
      postgres: {condition: service_healthy}
      auth-migrate: {condition: service_completed_successfully}
    networks:
      edge:
      private: {aliases: [auth-service.private]}

  user-service:
    <<: *hardened
    build: {context: ./backend, dockerfile: user-service/Dockerfile}
    image: ft-transcendence/user-service:local
    env_file: [secrets/env/user-service.env]
    environment:
      APP_ENV: production
      PORT: "8080"
      INTERNAL_PORT: "8081"
      MIGRATE_ON_START: "true"
      AVATAR_STORAGE_DIR: /var/lib/user-service/avatars
      AVATAR_BASE_URL: *public_base_url
      AUTH_SERVICE_CREDENTIAL_FILE: /run/secrets/auth-service-to-user-service
      GAME_SESSION_CREDENTIAL_FILE: /run/secrets/game-session-to-user-service
      AUTH_INTERNAL_URL: http://auth-service.private:8081
      AUTH_SERVICE_OUTBOUND_CREDENTIAL_FILE: /run/secrets/user-service-to-auth-service
      GAME_GATEWAY_INTERNAL_URLS: http://game-gateway.private:8081
      GAME_GATEWAY_OUTBOUND_CREDENTIAL_FILE: /run/secrets/user-service-to-game-gateway
      NOTIFICATION_GATEWAY_INTERNAL_URLS: http://notification-gateway.private:8081
      NOTIFICATION_GATEWAY_OUTBOUND_CREDENTIAL_FILE: /run/secrets/user-service-to-notification-gateway
      STATS_INTERNAL_URL: http://stats-service.private:8081
      STATS_SERVICE_OUTBOUND_CREDENTIAL_FILE: /run/secrets/user-service-to-stats-service
      GAME_INTERNAL_URL: http://game-session.private:8081
      GAME_SERVICE_OUTBOUND_CREDENTIAL_FILE: /run/secrets/user-service-to-game-session
    secrets:
      - auth-service-to-user-service
      - game-session-to-user-service
      - user-service-to-auth-service
      - user-service-to-game-gateway
      - user-service-to-notification-gateway
      - user-service-to-stats-service
      - user-service-to-game-session
    volumes:
      # Uploaded avatars; the image creates the directory owned by the service user.
      - user-avatars:/var/lib/user-service/avatars
    depends_on:
      postgres: {condition: service_healthy}
    networks:
      edge:
      private: {aliases: [user-service.private]}

  stats-service:
    <<: *hardened
    build: {context: ./backend, dockerfile: stats-service/Dockerfile}
    image: ft-transcendence/stats-service:local
    env_file: [secrets/env/stats-service.env]
    environment:
      APP_ENV: production
      PORT: "8080"
      INTERNAL_PORT: "8081"
      MIGRATE_ON_START: "true"
      USER_SERVICE_CREDENTIAL_FILE: /run/secrets/user-service-to-stats-service
      AUTH_INTERNAL_URL: http://auth-service.private:8081
      AUTH_SERVICE_OUTBOUND_CREDENTIAL_FILE: /run/secrets/stats-service-to-auth-service
      # RABBITMQ_URL is in the env file. The queue and its bindings belong to the
      # RabbitMQ topology (#189); until it declares this queue the consumer logs
      # and reconnects with backoff, and the rest of the service runs.
      STATS_EVENTS_QUEUE: ${STATS_EVENTS_QUEUE:-stats.game-events}
    secrets:
      - user-service-to-stats-service
      - stats-service-to-auth-service
    depends_on:
      postgres: {condition: service_healthy}
    networks:
      edge:
      private: {aliases: [stats-service.private]}

  game-session:
    <<: *hardened
    build: {context: ./backend, dockerfile: game-session/Dockerfile}
    image: ft-transcendence/game-session:local
    env_file: [secrets/env/game-session.env]
    environment:
      PORT: "8080"
      INTERNAL_PORT: "8081"
      TICK_INTERVAL: 1s
      LEAVE_PENALTY_BASE: "1"
      LEAVE_PENALTY_OPERATIVE_MULTIPLIER: "1"
      LEAVE_PENALTY_SPYMASTER_MULTIPLIER: "2"
      AUTH_SERVICE_CREDENTIAL_FILE: /run/secrets/auth-service-to-game-session
      USER_SERVICE_CREDENTIAL_FILE: /run/secrets/user-service-to-game-session
      GAME_GATEWAY_CREDENTIAL_FILE: /run/secrets/game-gateway-to-game-session
      USER_SERVICE_INTERNAL_URL: http://user-service.private:8081
      GAME_TO_USER_SERVICE_CREDENTIAL_FILE: /run/secrets/game-session-to-user-service
    secrets:
      - auth-service-to-game-session
      - user-service-to-game-session
      - game-gateway-to-game-session
      - game-session-to-user-service
    depends_on:
      postgres: {condition: service_healthy}
      game-migrate: {condition: service_completed_successfully}
    networks:
      edge:
      private: {aliases: [game-session.private]}

  game-gateway:
    <<: *hardened
    build: {context: ./backend, dockerfile: game-gateway/Dockerfile}
    image: ft-transcendence/game-gateway:local
    environment:
      APP_ENV: production
      PORT: "8080"
      # The private listener binds only to this address on the private network.
      INTERNAL_HOST: 172.29.11.20
      INTERNAL_PORT: "8081"
      PUBLIC_BASE_URL: *public_base_url
      AUTH_INTERNAL_URL: http://auth-service.private:8081
      AUTH_SERVICE_OUTBOUND_CREDENTIAL_FILE: /run/secrets/game-gateway-to-auth-service
      AUTH_INTERNAL_TIMEOUT: 3s
      GAME_INTERNAL_URL: http://game-session.private:8081
      GAME_SERVICE_OUTBOUND_CREDENTIAL_FILE: /run/secrets/game-gateway-to-game-session
      GAME_INTERNAL_TIMEOUT: 3s
      USER_SERVICE_CREDENTIAL_FILE: /run/secrets/user-service-to-game-gateway
      AUTH_SERVICE_CREDENTIAL_FILE: /run/secrets/auth-service-to-game-gateway
    secrets:
      - game-gateway-to-auth-service
      - game-gateway-to-game-session
      - user-service-to-game-gateway
      - auth-service-to-game-gateway
    networks:
      edge:
      private:
        ipv4_address: 172.29.11.20
        aliases: [game-gateway.private]

  notification-gateway:
    <<: *hardened
    build: {context: ./backend, dockerfile: notification-gateway/Dockerfile}
    image: ft-transcendence/notification-gateway:local
    environment:
      APP_ENV: production
      PORT: "8080"
      INTERNAL_HOST: 172.29.11.21
      INTERNAL_PORT: "8081"
      PUBLIC_BASE_URL: *public_base_url
      AUTH_INTERNAL_URL: http://auth-service.private:8081
      AUTH_SERVICE_OUTBOUND_CREDENTIAL_FILE: /run/secrets/notification-gateway-to-auth-service
      AUTH_INTERNAL_TIMEOUT: 3s
      USER_SERVICE_CREDENTIAL_FILE: /run/secrets/user-service-to-notification-gateway
      AUTH_SERVICE_CREDENTIAL_FILE: /run/secrets/auth-service-to-notification-gateway
    secrets:
      - notification-gateway-to-auth-service
      - user-service-to-notification-gateway
      - auth-service-to-notification-gateway
    networks:
      edge:
      private:
        ipv4_address: 172.29.11.21
        aliases: [notification-gateway.private]

  # --- Ingress: the only published port ---------------------------------------------
  ingress:
    <<: *hardened
    image: nginxinc/nginx-unprivileged:1.29-alpine
    ports:
      - "127.0.0.1:${INGRESS_PORT:-8443}:8443"
    volumes:
      - ./deploy/ingress/nginx.conf:/etc/nginx/nginx.conf:ro
    secrets:
      - source: tls_certificate
      - source: tls_key
    healthcheck:
      test: ["CMD", "wget", "-q", "--no-check-certificate", "-O", "/dev/null", "https://127.0.0.1:8443/ingress/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on: [auth-service, user-service, stats-service, game-session, game-gateway, notification-gateway]
    networks:
      edge:
        ipv4_address: 172.29.10.2

networks:
  edge:
    driver: bridge
    ipam:
      # Containers without a fixed address are given one from the upper half only,
      # so the fixed addresses in the lower half are never taken first.
      config: [{subnet: 172.29.10.0/24, ip_range: 172.29.10.128/25}]
  private:
    driver: bridge
    internal: true
    ipam:
      config: [{subnet: 172.29.11.0/24, ip_range: 172.29.11.128/25}]

volumes:
  postgres-data:
  rabbitmq-data:
  user-avatars:

secrets:
  postgres_superuser:        {file: ./secrets/postgres_superuser}
  db_auth_service:           {file: ./secrets/db/auth-service.password}
  db_user_service:           {file: ./secrets/db/user-service.password}
  db_stats_service:          {file: ./secrets/db/stats-service.password}
  db_game_session:           {file: ./secrets/db/game-session.password}
  tls_certificate:           {file: ./certs/server.crt}
  tls_key:                   {file: ./certs/server.key}
  auth-service-to-user-service:           {file: ./secrets/credentials/auth-service-to-user-service}
  auth-service-to-game-session:           {file: ./secrets/credentials/auth-service-to-game-session}
  auth-service-to-game-gateway:           {file: ./secrets/credentials/auth-service-to-game-gateway}
  auth-service-to-notification-gateway:   {file: ./secrets/credentials/auth-service-to-notification-gateway}
  user-service-to-auth-service:           {file: ./secrets/credentials/user-service-to-auth-service}
  user-service-to-game-gateway:           {file: ./secrets/credentials/user-service-to-game-gateway}
  user-service-to-notification-gateway:   {file: ./secrets/credentials/user-service-to-notification-gateway}
  user-service-to-stats-service:          {file: ./secrets/credentials/user-service-to-stats-service}
  user-service-to-game-session:           {file: ./secrets/credentials/user-service-to-game-session}
  game-session-to-user-service:           {file: ./secrets/credentials/game-session-to-user-service}
  stats-service-to-auth-service:          {file: ./secrets/credentials/stats-service-to-auth-service}
  game-gateway-to-auth-service:           {file: ./secrets/credentials/game-gateway-to-auth-service}
  game-gateway-to-game-session:           {file: ./secrets/credentials/game-gateway-to-game-session}
  notification-gateway-to-auth-service:   {file: ./secrets/credentials/notification-gateway-to-auth-service}
