  tags: [internal, gateway, session]
http:
  method: PUT
  url: "{{notificationGatewayInternalUrl}}/internal/v1/session-revocations/3f9b2c71-5d4e-4a86-9c1b-7e2a6d0f8b53"
  headers:
    - name: Authorization
      value: "Bearer {{authToNotificationGatewayServiceCredential}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "user_id": 42,
        "cause": "SESSION_REVOKED"
