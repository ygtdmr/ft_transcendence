info:
  name: Update own profile
  type: http
  seq: 3
  tags: [profile]
http:
  method: PATCH
  url: "{{baseUrl}}/api/{{apiVersion}}/users/me"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "username": "player_one_updated"
      }
docs: |-
  # Update own profile

  User Service owns username validation, case-insensitive uniqueness and the canonical update. Auth's registration/login/session responses subsequently obtain this value from User; neither Auth's credentials nor an old JWT can overwrite the renamed profile. User records the profile change and outgoing notification in its own PostgreSQL transaction/outbox.

  ## Purpose and preconditions

  Completes the Standard User Management contract (subject Ch. III–IV, Major module): lets a user edit their own profile. Requires an active session.

  ## Request parameters

  | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |
  | --- | --- | ---: | --- | --- | ---: | --- | --- |
  | `ft_session` cookie | request cookie | yes | string | active JWT access credential | no | Authenticates the owner | set by Register/Login |
  | `username` | body | no | string | trimmed `^[A-Za-z0-9_]{3,20}$`, case-insensitive uniqueness | no | New display name; omit to leave unchanged | `player_one_updated` |

  `email` and `password` are intentionally not editable here — email is the login identifier (changing it is an account-recovery-sensitive flow out of this contract's scope) and password change belongs to a dedicated re-auth-gated flow, also out of scope for this revision. Avatar has its own endpoint (`upload-avatar.yml`).

  ## Success behavior and response fields

  `200 OK` returns the updated profile, same shape as `Get own profile`. An identical username, or a body without `username`, changes nothing and sends no live update; a change of letter case only is a change.

  ## Live update

  A successful change reaches every view of the user at once. Members of the user's active room receive `room.player.updated` with `changed_fields: ["username"]` on the Game v2 room socket. The user's own sessions, their friends, and the other side of each pending friend request receive `user.profile.updated` on the notification socket. See `Social events` in the `WebSocket v2 - Notifications` collection.

  ## Errors

  | Status | Code | When |
  | --- | --- | --- |
  | `400` | `VALIDATION_ERROR` | malformed JSON, more than one JSON value, or a field other than `username` |
  | `401` | `UNAUTHORIZED` | invalid session, or the owner's account deletion is recorded |
  | `422` | `INVALID_USERNAME` | present but malformed, or `null` |
  | `409` | `USERNAME_TAKEN` | case-insensitive collision with another account |
  | `503` | `SERVICE_UNAVAILABLE` | a dependency cannot answer; repeating the same request is safe |
examples:
  - name: Success - Username updated
    request:
      url: "{{baseUrl}}/api/{{apiVersion}}/users/me"
      method: PATCH
      headers: [{name: Content-Type, value: application/json, enabled: true}]
      params: []
      body: {mode: json, json: '{"username": "player_one_updated"}'}
    response:
      status: 200
      headers: [{name: Content-Type, value: application/json}]
      body:
        type: json
        data: |-
          {
            "data": {
              "user_id": 42,
              "username": "player_one_updated",
              "email": "player.one@example.com",
              "avatar_url": "https://{{baseUrl}}/static/avatars/default/42.svg",
              "level": 4,
              "wins": 12,
              "losses": 8,
              "matches_played": 20,
              "penalty_points": 0,
              "active_room_id": null,
              "active_room_api_version": null,
              "created_at": "2026-08-01T10:00:00Z"
            }
          }
  - name: Error - Username taken
    request:
      url: "{{baseUrl}}/api/{{apiVersion}}/users/me"
      method: PATCH
      headers: [{name: Content-Type, value: application/json, enabled: true}]
      params: []
      body: {mode: json, json: '{"username": "red_agent"}'}
    response:
      status: 409
      headers: [{name: Content-Type, value: application/json}]
      body:
        type: json
        data: '{"error":{"code":"USERNAME_TAKEN","message":"Username ''red_agent'' is already registered.","details":{"field":"username"}}}'
