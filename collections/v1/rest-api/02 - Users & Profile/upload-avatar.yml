info:
  name: Upload avatar
  type: http
  seq: 4
  tags: [profile]
http:
  method: POST
  url: "{{baseUrl}}/api/{{apiVersion}}/users/me/avatar"
  headers:
    - name: Accept
      value: application/json
  body:
    type: multipartForm
    data:
      - name: avatar
        type: file
        value: []
docs: |-
  # Upload avatar

  ## Purpose and preconditions

  Completes the Standard User Management contract's avatar requirement. Requires an active session.

  ## Request parameters

  | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |
  | --- | --- | ---: | --- | --- | ---: | --- | --- |
  | `ft_session` cookie | request cookie | yes | string | active JWT access credential | no | Authenticates the owner | set by Register/Login |
  | `avatar` | multipart body | yes | file | `image/jpeg`, `image/png`, `image/webp`; `<= 2 MiB`; 32 to 4096 pixels per side and at most 16 megapixels; square recommended, server crops/resizes | no | New avatar image | `avatar.png` |

  MIME type, size and dimensions are validated server-side from the actual file bytes, never trusted from the client-declared filename or `Content-Type`. The server stores a new 256x256 PNG cropped to the center square, so the stored avatar is always PNG whatever the uploaded format, and image metadata is dropped. A user with no uploaded avatar renders a deterministic default derived from `user_id` (no upload step required to have *an* avatar).

  ## Success behavior and response fields

  `200 OK` replaces any previous uploaded avatar (the old file is deleted) and returns the new `avatar_url` under a new random file name, which then appears on own-profile, public-profile, friends-list, and room-member payloads.

  | Field | Type | Required | Nullable | Allowed values | Description |
  | --- | --- | ---: | ---: | --- | --- |
  | `data.avatar_url` | string | yes | no | URL | New avatar location |

  ## Live update

  A successful change reaches every view of the user at once. Members of the user's active room receive `room.player.updated` with `changed_fields: ["avatar_url"]` on the Game v2 room socket. The user's own sessions, their friends, and the other side of each pending friend request receive `user.profile.updated` on the notification socket. See `Social events` in the `WebSocket v2 - Notifications` collection.

  ## Errors

  | Status | Code | When |
  | --- | --- | --- |
  | `401` | `UNAUTHORIZED` | invalid session |
  | `422` | `INVALID_IMAGE` | wrong MIME type, corrupt file, over 2 MiB, or dimensions outside the limits |
examples:
  - name: Success - Avatar replaced
    request: {url: "{{baseUrl}}/api/{{apiVersion}}/users/me/avatar", method: POST, headers: [], params: [], body: {mode: none}}
    response:
      status: 200
      headers: [{name: Content-Type, value: application/json}]
      body:
        type: json
        data: |-
          {
            "data": {
              "avatar_url": "https://{{baseUrl}}/static/avatars/uploaded/42-9f86d081884c7d659a2feaa0c55ad015.png"
            }
          }
  - name: Error - Invalid image
    request: {url: "{{baseUrl}}/api/{{apiVersion}}/users/me/avatar", method: POST, headers: [], params: [], body: {mode: none}}
    response:
      status: 422
      headers: [{name: Content-Type, value: application/json}]
      body:
        type: json
        data: '{"error":{"code":"INVALID_IMAGE","message":"Avatar must be image/jpeg, image/png, or image/webp under 2 MiB.","details":{}}}'
