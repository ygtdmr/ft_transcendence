info:
  name: Get public profile
  type: http
  seq: 2
  tags: [profile]
http:
  method: GET
  url: "{{baseUrl}}/api/{{apiVersion}}/users/43"
  headers:
    - name: Accept
      value: application/json
docs: |-
  # Get public profile

  User Service owns the profile and caller-specific relationship fields. Auth validates the requester session; Stats supplies statistics and User queries Gateway registries for current presence. Auth credentials/login email remain private and never appear in this response.

  ## Purpose and preconditions

  Returns another player's public persistent profile. Authentication is required; room co-membership is not.

  ## Request parameters

  | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |
  | --- | --- | ---: | --- | --- | ---: | --- | --- |
  | `user_id` | path | yes | integer | positive | no | Target user | `43` |
  | `ft_session` cookie | request cookie | yes | string | active JWT access credential | no | Requesting identity | set by Register/Login |
  | `Accept` | header | yes | string | `application/json` | no | Requested response media type | `application/json` |

  ## Response fields

  | Field | Type | Required | Nullable | Allowed values | Description |
  | --- | --- | ---: | ---: | --- | --- |
  | `data.user_id` | integer | yes | no | positive | Public user ID |
  | `data.username` | string | yes | no | username rule | Public display name |
  | `data.avatar_url` | string | yes | no | URL | Uploaded avatar, or the deterministic default if none uploaded |
  | `data.level` | integer | yes | no | `>= 1` | Persistent level |
  | `data.wins` | integer | yes | no | `>= 0` | Wins |
  | `data.losses` | integer | yes | no | `>= 0` | Losses |
  | `data.matches_played` | integer | yes | no | `wins + losses` | Settled matches |
  | `data.is_online` | boolean | yes | no | `true`, `false` | At least one open authenticated connection right now (`workspace.yml`, Presence) |
  | `data.relationship` | string enum | yes | no | `NONE`, `REQUEST_SENT`, `REQUEST_RECEIVED`, `FRIENDS`, `BLOCKED` | The caller's relationship to this user (`workspace.yml`, Relationship model). A block placed by the other user reads as `NONE`; `BLOCKED` means the caller blocks this user |
  | `data.friend_request_id` | integer or null | yes | yes | positive or `null` | The pending request between the two users while `relationship` is `REQUEST_SENT` or `REQUEST_RECEIVED` (the caller accepts or declines a received one with it); otherwise `null` |

  ## State changes, events, and errors

  Read-only; no event. `401 UNAUTHORIZED` covers the requester session; `404 USER_NOT_FOUND` covers a valid positive ID with no user. `503 SERVICE_UNAVAILABLE` means presence is unknown; the response never reports it as offline. Session credentials, active room, team, role, and ready state are never public profile fields.
examples:
  - name: Success - red_agent
    request: {url: "{{baseUrl}}/api/{{apiVersion}}/users/43", method: GET, headers: [], params: [], body: {mode: none}}
    response:
      status: 200
      headers: [{name: Content-Type, value: application/json}]
      body:
        type: json
        data: |-
          {
            "data": {
              "user_id": 43,
              "username": "red_agent",
              "avatar_url": "https://{{baseUrl}}/static/avatars/default/43.svg",
              "level": 3,
              "wins": 9,
              "losses": 11,
              "matches_played": 20,
              "is_online": true,
              "relationship": "FRIENDS",
              "friend_request_id": null
            }
          }
  - name: Error - User not found
    request: {url: "{{baseUrl}}/api/{{apiVersion}}/users/9999", method: GET, headers: [], params: [], body: {mode: none}}
    response:
      status: 404
      headers: [{name: Content-Type, value: application/json}]
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "USER_NOT_FOUND",
              "message": "User 9999 was not found.",
              "details": {
                "user_id": 9999
              }
            }
          }
  - name: Error - Invalid path ID
    request: {url: "{{baseUrl}}/api/{{apiVersion}}/users/zero", method: GET, headers: [], params: [], body: {mode: none}}
    response:
      status: 422
      headers: [{name: Content-Type, value: application/json}]
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "VALIDATION_ERROR",
              "message": "user_id must be a positive integer.",
              "details": {
                "field": "user_id"
              }
            }
          }
