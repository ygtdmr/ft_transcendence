info:
  name: Register account
  type: http
  seq: 1
  tags: [identity, smoke]
http:
  method: POST
  url: "{{baseUrl}}/api/{{apiVersion}}/auth/register"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "player.one@example.com",
        "username": "player_one",
        "password": "Correct-Horse-1"
      }
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201 && res.body && res.body.data) {
          bru.setVar("userId", String(res.body.data.user.user_id));
        }
    - type: tests
      code: |-
        test("creates a registered user and sets session cookies", function () {
          expect(res.status).to.equal(201);
          expect(res.body.data.user.email).to.equal("player.one@example.com");
          expect(res.body.data.access_token_expires_at).to.be.a("string");
          expect(res.body.data).to.not.have.property("access_token");
          expect(res.body.data).to.not.have.property("refresh_token");
        });
docs: |-
  # Register account

  ## Purpose

  Auth Service owns this password-registration entry point (subject Ch. III–IV: email + password auth, hashed + salted at rest). It creates one Auth account, coordinates one User Service profile under the same Auth-assigned `user_id`, and issues one authenticated session pair. Google sign-in uses the same account/profile provisioning boundary; there is no guest/anonymous identity.

  ## Preconditions

  The client has no authenticated identity. Email must be unique (case-insensitive). Username must be unique (case-insensitive).

  ## Request parameters

  | Parameter | Location | Required | Type | Allowed values/range | Nullable | Description | Example |
  | --- | --- | ---: | --- | --- | ---: | --- | --- |
  | `Content-Type` | header | yes | string | `application/json` | no | JSON request media type | `application/json` |
  | `Accept` | header | yes | string | `application/json` | no | Requested response media type | `application/json` |
  | `email` | body | yes | string | valid email, trimmed, case-insensitive uniqueness | no | Login identifier | `player.one@example.com` |
  | `username` | body | yes | string | trimmed `^[A-Za-z0-9_]{3,20}$`, case-insensitive uniqueness | no | Public display name | `player_one` |
  | `password` | body | yes | string | `>= 8` and `<= 72` bytes (bcrypt input limit) | no | Hashed + salted server-side, never returned | `Correct-Horse-1` |

  ## Success behavior and response fields

  `201 Created` requires completed profile provisioning. Auth commits its account/session records locally; User commits its profile records in a separate local transaction, coordinated as described below. The response sets two cookies and returns no token value in the body (Session and Credential Model, `workspace.yml`): `ft_session` (HttpOnly, `Secure`, `SameSite=Lax`, `Path=/`, short-lived JWT access credential) and `ft_refresh` (HttpOnly, `Secure`, `SameSite=Lax`, `Path=/api/v1/auth/refresh`, long-lived opaque refresh credential). Only `ft_session` is sent on ordinary protected REST calls and WebSocket upgrades; `ft_refresh` is sent only to `/api/v1/auth/refresh` — no authentication header is used and no token value appears in JSON for any client, browser or non-browser; Bruno authenticates through its cookie jar exactly like a browser.

  | Field | Type | Required | Nullable | Allowed values | Description |
  | --- | --- | ---: | ---: | --- | --- |
  | `data.user.user_id` | integer | yes | no | positive | Stable user identifier |
  | `data.user.username` | string | yes | no | username rule | Display username |
  | `data.user.email` | string | yes | no | valid email | Login identifier |
  | `data.user.created_at` | `string<date-time>` | yes | no | ISO 8601 UTC | Account creation time |
  | `data.access_token_expires_at` | `string<date-time>` | yes | no | ISO 8601 UTC | `ft_session` expiry, for client-side UX timers only — the token itself is never in this body |

  ## State changes and events

  Auth persists the account/email/password and session pair in its PostgreSQL records; User persists the canonical username/default-avatar profile in its own PostgreSQL records. Auth uses a durable internal `operation_id` to coordinate idempotent provisioning and enforces email uniqueness; User enforces username uniqueness. `201` and both cookies require completed provisioning. Failed provisional work is durably retried or compensated without leaving a usable partial account or permanently orphaned reservations. No room membership is created and no WebSocket event is emitted. See `workspace.yml`, Auth and User Service Boundary.

  ## Errors

  | Status | Code | When | State change |
  | --- | --- | --- | --- |
  | `400` | `VALIDATION_ERROR` | malformed JSON or unexpected structure | none |
  | `422` | `INVALID_EMAIL` | missing or malformed email | none |
  | `422` | `INVALID_USERNAME` | missing, wrong type, length, or characters | none |
  | `422` | `INVALID_PASSWORD` | missing, under minimum length, or over the 72-byte hashing limit | none |
  | `409` | `EMAIL_TAKEN` | case-insensitive email already exists | none |
  | `409` | `USERNAME_TAKEN` | case-insensitive username already exists | none |
  | `429` | `RATE_LIMITED` | registration limit exceeded | none |
  | `503` | `SERVICE_UNAVAILABLE` | profile provisioning could not be confirmed, for example because User Service is unreachable | the account is kept pending without a session; no cookie is set |

  After `503 SERVICE_UNAVAILABLE`, the client may repeat the same registration (same email, username and password) or log in with the same email and password. Either one resumes the original provisioning operation and succeeds once the profile is confirmed; a repeated registration with a different username or password answers `409 EMAIL_TAKEN`. If User Service reports the username as taken or invalid, the pending account is removed and the registration answers `409 USERNAME_TAKEN` or `422 INVALID_USERNAME`.

  ## Notes/invariants

  The password is never returned or logged. A duplicate transmission cannot claim an existing email or username. `ft_refresh` is scoped to `Path=/api/v1/auth/refresh`, so the browser never sends it on any other request — it exists solely for the Refresh endpoint to read.
examples:
  - name: Success - player_one
    request:
      url: "{{baseUrl}}/api/{{apiVersion}}/auth/register"
      method: POST
      headers: [{name: Content-Type, value: application/json, enabled: true}, {name: Accept, value: application/json, enabled: true}]
      params: []
      body:
        mode: json
        json: |-
          {
            "email": "player.one@example.com",
            "username": "player_one",
            "password": "Correct-Horse-1"
          }
    response:
      status: 201
      headers:
        - {name: Content-Type, value: application/json}
        - {name: Set-Cookie, value: "ft_session=eyJhbGciOiJIUzI1NiJ9...; HttpOnly; Secure; SameSite=Lax; Path=/"}
        - {name: Set-Cookie, value: "ft_refresh=rtok_7Hk2mQ9vLc4R8pXaZq; HttpOnly; Secure; SameSite=Lax; Path=/api/v1/auth/refresh"}
      body:
        type: json
        data: |-
          {
            "data": {
              "user": {
                "user_id": 42,
                "username": "player_one",
                "email": "player.one@example.com",
                "created_at": "2026-09-10T08:40:01Z"
              },
              "access_token_expires_at": "2026-09-10T09:10:01Z"
            }
          }
  - name: Error - Invalid email
    request:
      url: "{{baseUrl}}/api/{{apiVersion}}/auth/register"
      method: POST
      headers: [{name: Content-Type, value: application/json, enabled: true}]
      params: []
      body:
        mode: json
        json: |-
          {
            "email": "not-an-email",
            "username": "player_one",
            "password": "Correct-Horse-1"
          }
    response:
      status: 422
      headers: [{name: Content-Type, value: application/json}]
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "INVALID_EMAIL",
              "message": "email must be a valid email address.",
              "details": {
                "field": "email"
              }
            }
          }
  - name: Error - Password too short
    request:
      url: "{{baseUrl}}/api/{{apiVersion}}/auth/register"
      method: POST
      headers: [{name: Content-Type, value: application/json, enabled: true}]
      params: []
      body:
        mode: json
        json: |-
          {
            "email": "player.one@example.com",
            "username": "player_one",
            "password": "short"
          }
    response:
      status: 422
      headers: [{name: Content-Type, value: application/json}]
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "INVALID_PASSWORD",
              "message": "password must be at least 8 characters.",
              "details": {
                "field": "password",
                "min_length": 8
              }
            }
          }
  - name: Error - Email already exists
    request:
      url: "{{baseUrl}}/api/{{apiVersion}}/auth/register"
      method: POST
      headers: [{name: Content-Type, value: application/json, enabled: true}]
      params: []
      body:
        mode: json
        json: |-
          {
            "email": "PLAYER.ONE@example.com",
            "username": "someone_else",
            "password": "Correct-Horse-1"
          }
    response:
      status: 409
      headers: [{name: Content-Type, value: application/json}]
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "EMAIL_TAKEN",
              "message": "Email 'PLAYER.ONE@example.com' is already registered.",
              "details": {
                "field": "email"
              }
            }
          }
  - name: Error - Username already exists
    request:
      url: "{{baseUrl}}/api/{{apiVersion}}/auth/register"
      method: POST
      headers: [{name: Content-Type, value: application/json, enabled: true}]
      params: []
      body:
        mode: json
        json: |-
          {
            "email": "someone.else@example.com",
            "username": "PLAYER_ONE",
            "password": "Correct-Horse-1"
          }
    response:
      status: 409
      headers: [{name: Content-Type, value: application/json}]
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "USERNAME_TAKEN",
              "message": "Username 'PLAYER_ONE' is already registered.",
              "details": {
                "field": "username"
              }
            }
          }
  - name: Error - Profile provisioning unavailable
    request:
      url: "{{baseUrl}}/api/{{apiVersion}}/auth/register"
      method: POST
      headers: [{name: Content-Type, value: application/json, enabled: true}]
      params: []
      body:
        mode: json
        json: |-
          {
            "email": "player.one@example.com",
            "username": "player_one",
            "password": "Correct-Horse-1"
          }
    response:
      status: 503
      headers: [{name: Content-Type, value: application/json}]
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "SERVICE_UNAVAILABLE",
              "message": "The service is temporarily unavailable. Try again later.",
              "details": {}
            }
          }
