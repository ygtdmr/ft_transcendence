info:
  name: End current session
  type: http
  seq: 5
  tags: [identity]
http:
  method: DELETE
  url: "{{baseUrl}}/api/{{apiVersion}}/auth/session"
  headers:
    - name: Accept
      value: application/json
docs: |-
  # End current session

  Auth Service owns session/refresh revocation and Gateway close notifications. It coordinates the authoritative departure with Game Session; User Service retains the profile and social relationships. This single-session logout is distinct from User Service's account-deletion operation, which revokes all sessions and cleans each service's owned data.

  ## Purpose and preconditions

  Revokes the current session (`ft_session` and `ft_refresh`, from Register, Login, or Refresh) and clears both cookies. The user account and persistent statistics remain. Logout is legal regardless of room membership (`workspace.yml`, Session and Credential Model / Reconnect Grace Period and Abandonment). Departure follows the membership's `active_room_api_version`: legacy Game v1 `IN_GAME` uses `PLAYER_FORFEIT`; Game v2 follows its leave and staffing rules. There is no `409 ALREADY_IN_ROOM` block. Logout also closes every open, authenticated WebSocket connection (room and notification) belonging to this session. In a Game v2 room, logout is a departure with reason `SESSION_ENDED` and follows the Game v2 leave rules instead of the forfeit: during `IN_GAME` a participant receives the leave penalty and team staffing is rechecked (`workspace.yml`, Leave Penalty).

  ## Request parameters

  | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |
  | --- | --- | ---: | --- | --- | ---: | --- | --- |
  | `ft_session` cookie | request cookie | yes | string | active JWT access credential | no | Session to revoke | set by Register/Login |

  ## Success, state changes, and events

  `204 No Content` has no body. It revokes both `ft_session` and `ft_refresh`, clears both cookies, and closes open sockets for this session. For legacy Game v1 `IN_GAME` membership, departure emits `game.ended` with `end_reason:"PLAYER_FORFEIT"`. For Game v2 membership, logout removes the member with reason `SESSION_ENDED`, rechecks staffing and records the existing eligible-participant penalty; it does not declare a forfeit.

  ## Errors

  `401 UNAUTHORIZED` covers invalid/revoked tokens. There is no room-membership error on this endpoint.

  `503 SERVICE_UNAVAILABLE` with an empty details object means Game Session could not record the departure, even after Auth repeated the request. Nothing is revoked and the cookies stay set, so the session remains valid and the client may retry the logout. Once the revocation is recorded, logout answers `204` even if a gateway is temporarily unreachable; the socket closure follows when the gateway answers.
examples:
  - name: Success - Session revoked, no active room
    request: {url: "{{baseUrl}}/api/{{apiVersion}}/auth/session", method: DELETE, headers: [{name: Accept, value: application/json, enabled: true}], params: [], body: {mode: none}}
    response: {status: 204, headers: [{name: Set-Cookie, value: "ft_session=; Max-Age=0; HttpOnly; Secure; SameSite=Lax; Path=/"}, {name: Set-Cookie, value: "ft_refresh=; Max-Age=0; HttpOnly; Secure; SameSite=Lax; Path=/api/v1/auth/refresh"}], body: {type: text, data: ""}}
  - name: Success - Session revoked, legacy Game v1 forfeit
    request: {url: "{{baseUrl}}/api/{{apiVersion}}/auth/session", method: DELETE, headers: [{name: Accept, value: application/json, enabled: true}], params: [], body: {mode: none}}
    response: {status: 204, headers: [{name: Set-Cookie, value: "ft_session=; Max-Age=0; HttpOnly; Secure; SameSite=Lax; Path=/"}, {name: Set-Cookie, value: "ft_refresh=; Max-Age=0; HttpOnly; Secure; SameSite=Lax; Path=/api/v1/auth/refresh"}], body: {type: text, data: ""}}
  - name: Error - Already revoked
    request: {url: "{{baseUrl}}/api/{{apiVersion}}/auth/session", method: DELETE, headers: [{name: Accept, value: application/json, enabled: true}, {name: Cookie, value: "ft_session=alreadyRevoked", enabled: true}], params: [], body: {mode: none}}
    response:
      status: 401
      headers: [{name: Content-Type, value: application/json}]
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "UNAUTHORIZED",
              "message": "A valid active session is required.",
              "details": {}
            }
          }
  - name: Error - Game Session unavailable
    request: {url: "{{baseUrl}}/api/{{apiVersion}}/auth/session", method: DELETE, headers: [{name: Accept, value: application/json, enabled: true}], params: [], body: {mode: none}}
    response:
      status: 503
      headers: [{name: Content-Type, value: application/json}]
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "SERVICE_UNAVAILABLE",
              "message": "The service is temporarily unavailable. Try again later.",
              "details": {}
            }
          }
