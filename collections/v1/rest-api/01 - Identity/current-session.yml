info:
  name: Get current session
  type: http
  seq: 4
  tags: [identity]
http:
  method: GET
  url: "{{baseUrl}}/api/{{apiVersion}}/auth/session"
  headers:
    - name: Accept
      value: application/json
docs: |-
  # Get current session

  Auth Service owns this composed public endpoint: it validates its session, reads the current canonical username from User Service and obtains current room membership from Game Session. Gateway admission uses Auth's separate internal session-validation operation, which needs only Auth's account/session records and returns `user_id`, `session_id` and expiry without querying profile, room or Stats services. See `workspace.yml`, Auth and User Service Boundary.

  ## Purpose and preconditions

  Resolves the `ft_session` credential (from Register, Login, or Refresh) to its user and current room membership, derived live from Game Session's authoritative membership index (`workspace.yml`, State Ownership) — never a stale cached value. A valid unexpired `ft_session` cookie is required; this is also the endpoint frontend route recovery calls on bootstrap to decide which screen and protocol version to restore.

  ## Request parameters

  | Parameter | Location | Required | Type | Allowed values | Nullable | Description | Example |
  | --- | --- | ---: | --- | --- | ---: | --- | --- |
  | `ft_session` cookie | request cookie | yes | string | active JWT access credential | no | Shared REST/WebSocket credential | set by Register/Login |
  | `Accept` | header | yes | string | `application/json` | no | Requested response media type | `application/json` |

  ## Success and response fields

  `200 OK` returns the authenticated identity without reissuing a token.

  | Field | Type | Required | Nullable | Allowed values | Description |
  | --- | --- | ---: | ---: | --- | --- |
  | `data.user.user_id` | integer | yes | no | positive | Authenticated user |
  | `data.user.username` | string | yes | no | username rule | Current canonical username from User Service |
  | `data.active_room_id` | integer or null | yes | yes | positive or `null` | Current live room membership (from Game Session's membership index), never a permanent profile field |
  | `data.active_room_api_version` | string enum or null | yes | yes | `v1`, `v2`, or `null` | REST/room-WebSocket pair the frontend must restore; null exactly when `active_room_id` is null |
  | `data.session_expires_at` | `string<date-time>` | yes | no | ISO 8601 UTC | `ft_session` expiry |

  ## State changes, events, and errors

  Read-only; no event. Missing, invalid, revoked, or expired `ft_session` returns `401 UNAUTHORIZED` and an empty details object — the frontend should attempt `POST /api/v1/auth/refresh` before treating this as a full logout. If User Service cannot supply the current username, the response is `503 SERVICE_UNAVAILABLE`; a stored name is never returned.
examples:
  - name: Success - No active room
    request: {url: "{{baseUrl}}/api/{{apiVersion}}/auth/session", method: GET, headers: [{name: Accept, value: application/json, enabled: true}], params: [], body: {mode: none}}
    response:
      status: 200
      headers: [{name: Content-Type, value: application/json}]
      body:
        type: json
        data: |-
          {
            "data": {
              "user": {
                "user_id": 42,
                "username": "player_one"
              },
              "active_room_id": null,
              "active_room_api_version": null,
              "session_expires_at": "2026-09-10T09:10:01Z"
            }
          }
  - name: Success - Active room
    request: {url: "{{baseUrl}}/api/{{apiVersion}}/auth/session", method: GET, headers: [{name: Accept, value: application/json, enabled: true}], params: [], body: {mode: none}}
    response:
      status: 200
      headers: [{name: Content-Type, value: application/json}]
      body:
        type: json
        data: |-
          {
            "data": {
              "user": {
                "user_id": 42,
                "username": "player_one"
              },
              "active_room_id": 1001,
              "active_room_api_version": "v2",
              "session_expires_at": "2026-09-10T09:10:01Z"
            }
          }
  - name: Error - Invalid session
    request: {url: "{{baseUrl}}/api/{{apiVersion}}/auth/session", method: GET, headers: [{name: Accept, value: application/json, enabled: true}, {name: Cookie, value: "ft_session=invalid", enabled: true}], params: [], body: {mode: none}}
    response:
      status: 401
      headers: [{name: Content-Type, value: application/json}]
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "UNAUTHORIZED",
              "message": "A valid active session is required.",
              "details": {}
            }
          }
