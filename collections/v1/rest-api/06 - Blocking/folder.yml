docs: |-
  # Blocking

  A user blocks another user to stop private contact. User Service applies a block atomically with all of its effects (`workspace.yml`, Friends and Presence): pending friend requests between the two users are cancelled, an existing friendship is suspended (kept but inactive, absent from friend lists), and friend requests and acceptances between them are refused. Unblocking lifts only the caller's own block; a suspended friendship becomes active again once neither user blocks the other, and nothing else is recreated. The blocked user is never told about the block.
